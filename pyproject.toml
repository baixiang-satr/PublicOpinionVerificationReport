# =============================================================================
# 舆情验证报告工具 — 项目元数据配置
# =============================================================================
# 参考 MediaCrawler 的 pyproject.toml 结构。
# 本项目使用 PEP 621 标准格式管理项目元数据。
# =============================================================================

[project]
name = "public-opinion-verification-report"
version = "0.1.0"
description = "舆情验证报告桌面工具 —— 批量采集网页并交付固定 template.zip"
authors = [
    { name = "developer" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.61.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "lxml>=5.3.0",
    "beautifulsoup4>=4.13.0",
    "parsel>=1.9.0",
    "openpyxl>=3.1.2",
    "pywin32>=308; platform_system == 'Windows'",
    "chardet>=5.2.0",
    "PyQt5>=5.15.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "aiofiles>=24.1.0",
    "rapidocr-onnxruntime>=1.2.3",
    "Pillow>=10.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/example/public-opinion-verification-report"

# =============================================================================
# 工具配置
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "excel: requires pywin32 and a local Microsoft Excel automation server",
    "playwright: requires an installed local Playwright Chromium executable",
    "ui: requires PyQt5 and an offscreen-capable Qt platform",
    "external: opt-in tests that access real public websites",
]

[tool.pylint.MASTER]
max-line-length = 120

# =============================================================================
# 打包配置（使用 PEP 660 的 editabel install）
# =============================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
